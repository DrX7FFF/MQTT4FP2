<script type="text/javascript">
    RED.nodes.registerType("fp2", {
        category: "input",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            pairingFile: { value: "data/pairing.json", required: true },
            pairingAlias: { value: "fp2", required: true },
            host: { value: "" },
            port: {
                value: "",
                validate: function(value) {
                    return value === "" || (/^\d+$/.test(value) && Number(value) >= 1 && Number(value) <= 65535);
                }
            },
            topicPrefix: { value: "fp2", required: true }
        },
        inputs: 0,
        outputs: 1,
        icon: "bridge.svg",
        label: function() { return this.name || "FP2 zones"; }
    });
</script>

<script type="text/html" data-template-name="fp2">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nom</label>
        <input type="text" id="node-input-name" placeholder="FP2 salon">
    </div>
    <div class="form-row">
        <label for="node-input-pairingFile"><i class="fa fa-file"></i> Pairing</label>
        <input type="text" id="node-input-pairingFile" placeholder="/chemin/data/pairing.json">
    </div>
    <div class="form-row">
        <label for="node-input-pairingAlias"><i class="fa fa-key"></i> Alias</label>
        <input type="text" id="node-input-pairingAlias" placeholder="fp2">
    </div>
    <div class="form-row">
        <label for="node-input-host"><i class="fa fa-globe"></i> Adresse IP</label>
        <input type="text" id="node-input-host" placeholder="Adresse du pairing">
    </div>
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> Port HAP</label>
        <input type="text" id="node-input-port" placeholder="Port du pairing">
    </div>
    <div class="form-row">
        <label for="node-input-topicPrefix"><i class="fa fa-list"></i> Prefixe</label>
        <input type="text" id="node-input-topicPrefix" placeholder="fp2">
    </div>
</script>

<script type="text/html" data-help-name="fp2">
    <p>Entree HomeKit pour les changements de presence du FP2, sans MQTT.</p>
    <p>Le fichier d'appairage aiohomekit existant doit etre accessible au processus
    Node-RED. Un chemin relatif est resolu depuis le dossier utilisateur Node-RED.
    Adresse et port vides utilisent les valeurs du fichier.</p>
    <p>La sortie contient <code>msg.topic</code> (fp2/zone/nom),
    <code>msg.payload</code> (booleen), <code>msg.zone</code> (nom expose),
    <code>msg.aid</code>, <code>msg.iid</code> (chaines) et <code>msg.timestamp</code> (UTC).</p>
    <p>L'etat initial est lu silencieusement. Seuls les changements suivants sont
    emis. Toute presence HAP notifiable est incluse, y compris la presence globale
    si le FP2 l'expose. Arreter la passerelle Python utilisant le meme pairing.</p>
</script>
